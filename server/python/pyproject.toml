[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-communication-server"
version = "1.0.0"
description = "Secure Communication protocol v1 server for ASGI and FastAPI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41,<47",
  "fastapi>=0.100,<1",
  "redis>=5,<7",
  "uvicorn>=0.23,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.24,<1", "pytest>=7,<9", "pytest-asyncio>=0.21,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
